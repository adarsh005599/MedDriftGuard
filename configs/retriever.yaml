# Retriever Configuration
retriever:
  type: "hybrid" # Options: "dense_only", "bm25_only", "hybrid", "hybrid_rerank"
  top_k: 5
  rrf_k: 60 # Reciprocal Rank Fusion constant

dense:
  model_name: "BAAI/bge-m3"
  dimension: 1024
  normalize_embeddings: true
  index_type: "qdrant" # Options: "qdrant", "faiss"
  qdrant_path: "kb/index/qdrant_local"
  collection_name: "medical_kb"

sparse:
  algorithm: "bm25"
  k1: 1.5
  b: 0.75
  index_file: "kb/index/bm25.pkl"

reranker:
  enabled: true
  model_name: "BAAI/bge-reranker-large"
  top_n_candidates: 20
